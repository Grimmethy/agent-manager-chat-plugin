<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>System Chat</title>
<!-- RELATIVE hrefs/src throughout this file, deliberately -- this page is reached via
     the host dashboard's generic proxy (/api/plugins/<name>/proxy/<subpath>), so the
     iframe's own document URL IS that proxy path, not this plugin's real port. An
     absolute "/static/chat.css" would resolve against the HOST's own origin instead
     (wrong file, likely 404) -- "static/chat.css" resolves relative to the current
     proxy path instead, which the proxy then forwards correctly. Same reasoning applies
     to every fetch() call in chat.js. -->
<link rel="stylesheet" href="static/chat.css">
</head>
<body>
<!-- This page is served inside the host dashboard's persistent-sidebar iframe (see
     agent-manager's static/js/core-ui.js, the slotKind:"persistent-sidebar" mounting).
     It is a full, standalone document -- no shared JS/CSS context with the host, by
     design (same-origin-policy-isolated anyway once served from this plugin's own
     port/proxy path). See app.py's own header and
     /home/wok/.claude/plans/immutable-noodling-axolotl.md's "Shared frontend
     rendering" section for why this repo has its own independent transcript renderer
     (chatRenderTranscript in chat.js) instead of reusing agent-manager's
     grillRenderTranscript -- an iframe can't call a function in a different document
     anyway, and the two features drifting independently is fine (each is free to
     evolve without breaking the other), where the in-tree version's shared function had
     a documented class-collision bug from exactly this kind of coupling. -->
<!-- Sole-id contract: #chat-panel is the ONLY id in this document and the sole getElementById contract (mountChat() in static/chat.js).
     ChatPane.build() replaces its innerHTML with class-based DOM on load, so any consumer (host core-ui.js persistent-sidebar
     mount, a future multi-pane orchestrator) must query class selectors inside the pane root -- never id-based names. -->
<div id="chat-panel"></div>
<!-- Classic (non-module) script, so it runs before any module below: chat.js's mountChat() then returns early and the old single
     ChatPane above the strip is never mounted; static/multi-chat.js owns the whole page (switcher, strip, panes). -->
<script>window.__CHAT_MULTI_PANES__ = true;</script>
<!-- type="module" so chat.js can `import` static/vendor/smd.js -- module import
     specifiers resolve against the importing MODULE's own URL, not the document's, so
     this stays proxy-safe the same way the plain relative src= above is. -->
<script type="module" src="static/chat.js"></script>
<script src="static/vendor/dockview.js"></script>
<!-- dockview-grid.js wraps createDockview and defines window.DockviewGrid for
     static/multi-chat.js's tryRenderDockview(); loaded AFTER the vendored bundle
     (so globalThis['dockview-core'] is set) and BEFORE multi-chat.js (so the
     adapter is ready when it runs). -->
<script src="static/dockview-grid.js"></script>
<script type="module" src="static/multi-chat.js"></script>
</body>
</html>
