<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>System Chat</title>
<!-- RELATIVE hrefs/src throughout this file, deliberately -- this page is reached via
     the host dashboard's generic proxy (/api/plugins/<name>/proxy/<subpath>), so the
     iframe's own document URL IS that proxy path, not this plugin's real port. An
     absolute "/static/chat.css" would resolve against the HOST's own origin instead
     (wrong file, likely 404) -- "static/chat.css" resolves relative to the current
     proxy path instead, which the proxy then forwards correctly. Same reasoning applies
     to every fetch() call in chat.js. -->
<link rel="stylesheet" href="static/chat.css">
</head>
<body>
<!-- This page is served inside the host dashboard's persistent-sidebar iframe (see
     agent-manager's static/js/core-ui.js, the slotKind:"persistent-sidebar" mounting).
     It is a full, standalone document -- no shared JS/CSS context with the host, by
     design (same-origin-policy-isolated anyway once served from this plugin's own
     port/proxy path). See app.py's own header and
     /home/wok/.claude/plans/immutable-noodling-axolotl.md's "Shared frontend
     rendering" section for why this repo has its own independent transcript renderer
     (chatRenderTranscript in chat.js) instead of reusing agent-manager's
     grillRenderTranscript -- an iframe can't call a function in a different document
     anyway, and the two features drifting independently is fine (each is free to
     evolve without breaking the other), where the in-tree version's shared function had
     a documented class-collision bug from exactly this kind of coupling. -->
<div id="chat-panel">
  <div class="chat-header">
    <h2 id="chat-title" title="Rooted at the agent-manager repo, with read/write access to every registered plugin and project repo.">System Chat</h2>
    <span id="chat-provider-container"></span>
    <button type="button" class="secondary" id="chat-reserve-btn" style="display:none" title="Hold the local model exclusively for this conversation until you turn it back off">Reserve</button>
    <button type="button" class="secondary" id="chat-context-log-btn" title="View this session's context log -- a compacted, durable record built from CONTEXT-LOG: blocks at the end of each response, cross-referenced to any task discussed">Log</button>
    <button type="button" class="secondary" id="chat-new-btn" title="Start a fresh conversation">New</button>
  </div>
  <!-- Collapsed by default; toggled by #chat-context-log-btn. See chat.js's own comment
       on why this panel's one fetch call is an ABSOLUTE path, unlike every other
       fetch()/href/src in this file -- it deliberately targets the core dashboard's own
       route, not this plugin's proxied ones. -->
  <div id="chat-context-log-panel" hidden>
    <div class="chat-context-log-header">
      <span>Context Log</span>
      <button type="button" class="secondary" id="chat-context-log-close">Close</button>
    </div>
    <div id="chat-context-log-content"></div>
  </div>
  <div class="chat-body">
    <div id="chat-transcript"></div>
    <textarea class="chat-input" id="chat-input" rows="3" placeholder="Talk to the chat... (Enter to send, Shift+Enter for a new line)"></textarea>
    <div class="chat-send-row">
      <button type="button" class="action" id="chat-send-btn">Send</button>
    </div>
  </div>
</div>
<script src="static/chat.js"></script>
</body>
</html>
